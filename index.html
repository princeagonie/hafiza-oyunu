<main id="app">

  <!-- ================= ANA MENÜ ================= -->
  <section id="scr-start" class="screen is-active">

    <!-- Kapak fotoğrafı: Wikimedia Commons, "Public domain in Turkey"
         Atatürk Orman Çiftliği'nde Ülkü ile (1930'lar) -->
    <figure class="cover">
      <div class="cover-frame">
        <img src="assets/ulku-child.jpg" alt="Atatürk, Orman Çiftliği'nde manevi kızı Ülkü ile">
      </div>
      <svg class="cover-foxy"><use href="#art-foxy"></use></svg>
      <svg class="cover-flag"><use href="#art-bayrak"></use></svg>
      <figcaption>Atatürk, Orman Çiftliği'nde Ülkü ile</figcaption>
    </figure>

    <h1>Atatürk, Ülkü <span>ve</span> Foxy</h1>
    <p class="sub">50 Bölümlük Hafıza Oyunu</p>

    <div class="modes">
      <button id="btn-play" class="btn btn-primary">Oyna</button>
      <button id="btn-continue" class="btn btn-secondary" hidden>Devam Et <small></small></button>
    </div>

    <p class="best" id="best-line" hidden></p>
  </section>

  <!-- ================= BÖLÜM HARİTASI ================= -->
  <section id="scr-map" class="screen">
    <header class="hud">
      <button class="icon-btn" data-go="scr-start" aria-label="Ana menü"><svg class="ui"><use href="#ui-back"></use></svg></button>
      <div class="stat stat-wide">
        <span class="stat-k">Toplam Yıldız</span>
        <b><svg class="mini-star"><use href="#art-star"></use></svg> <span id="total-stars">0</span> / 150</b>
      </div>
      <button id="btn-sound" class="icon-btn" aria-label="Sesi aç/kapat"><svg class="ui"><use id="sound-use" href="#ui-sound"></use></svg></button>
    </header>
    <div id="levels" class="levels"></div>
  </section>

  <!-- ================= OYUN ================= -->
  <section id="scr-game" class="screen">
    <header class="hud">
      <button id="btn-quit" class="icon-btn" aria-label="Haritaya dön"><svg class="ui"><use href="#ui-back"></use></svg></button>
      <div class="stat"><span class="stat-k">Bölüm</span><b id="hud-level">1</b></div>
      <div class="stat"><span class="stat-k">Süre</span><b id="hud-time">0:00</b></div>
      <div class="stat"><span class="stat-k">Eş</span><b id="hud-pairs">0/3</b></div>
    </header>
    <div id="board" class="board" role="grid" aria-label="Oyun tahtası"></div>
    <p class="tip" id="tip"></p>
  </section>

  <!-- ================= BÖLÜM TAMAMLANDI ================= -->
  <section id="scr-win" class="screen">
    <div class="win-card">
      <svg class="win-foxy"><use href="#art-foxy"></use></svg>
      <p class="win-level" id="win-level">Bölüm 1</p>
      <h2 id="win-title">Aferin!</h2>

      <div class="stars" id="win-stars" aria-label="Puan">
        <svg class="star"><use href="#art-star"></use></svg>
        <svg class="star"><use href="#art-star"></use></svg>
        <svg class="star"><use href="#art-star"></use></svg>
      </div>

      <div class="win-stats">
        <div><span>Süre</span><b id="win-time">0:00</b></div>
        <div><span>Hamle</span><b id="win-moves">0</b></div>
      </div>

      <div class="fact">
        <svg class="fact-art"><use id="fact-use" href="#art-foxy"></use></svg>
        <div>
          <span class="fact-k">Biliyor muydun?</span>
          <p id="fact-text"></p>
        </div>
      </div>

      <button id="btn-next" class="btn btn-primary">Sonraki Bölüm</button>
      <button id="btn-retry" class="btn btn-ghost">Tekrar Oyna</button>
      <button class="btn btn-ghost" data-go="scr-map">Bölümler</button>
    </div>
  </section>

  <!-- ================= OYUN BİTTİ ================= -->
  <section id="scr-final" class="screen">
    <div class="win-card">
      <svg class="win-foxy"><use href="#art-bayrak"></use></svg>
      <h2>Tebrikler!</h2>
      <p class="pitch">50 bölümün hepsini tamamladın.<br>Foxy ve Ülkü seninle gurur duyuyor!</p>
      <div class="win-stats">
        <div><span>Toplam Yıldız</span><b id="final-stars">0</b></div>
      </div>
      <button class="btn btn-primary" data-go="scr-map">Bölümlere Dön</button>
    </div>
  </section>

  <div id="confetti" aria-hidden="true"></div>

  <!-- Reklam yüklenirken gösterilen örtü -->
  <div id="ad-cover" aria-hidden="true">
    Reklam yükleniyor
    <small>Birazdan oyuna dönüyoruz</small>
  </div>
</main>

<script src="ads.js"></script>
<script src="game.js"></script>
</body>
</html>
